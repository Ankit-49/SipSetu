[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests

[coverage:run]
source = .
omit =
    */tests/*
    */migrations/*
    */venv/*
    */__pycache__/*
    */alembic/*
    */.venv/*
    config.py
    app.py
    celery_app.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING: