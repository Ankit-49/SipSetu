version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sipsetu-postgres
    environment:
      POSTGRES_DB: sipsetu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sipsetu"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sipsetu-network

  # Redis for caching, rate limiting, Celery
  redis:
    image: redis:7-alpine
    container_name: sipsetu-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sipsetu-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sipsetu-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sipsetu
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-sipsetu-dev-jwt-secret-change-in-production}
      FRONTEND_URL: http://localhost:5173
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_FROM: ${SMTP_FROM:-noreply@sipsetu.com}
      FLASK_ENV: development
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    labels:
      - "logging=promtail"
    volumes:
      - ./backend:/app
      - backend_ml_artifacts:/app/ml_artifacts
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sipsetu-network
    restart: unless-stopped

  # Frontend (Vite dev server for development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    container_name: sipsetu-frontend-dev
    environment:
      VITE_API_URL: http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    networks:
      - sipsetu-network

  # Frontend production (Nginx)
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: sipsetu-frontend-prod
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sipsetu-network
    profiles:
      - production

  # Celery worker for background tasks. Consumes the interactive queues
  # (default + email high-priority + bulk screening); the low-priority ML
  # retraining queue runs on its own dedicated worker below (Phase 4.3).
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sipsetu-celery-worker
    command: celery -A celery_app worker --loglevel=info --concurrency=4 -Q celery,email,bulk_screen
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sipsetu
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-sipsetu-dev-jwt-secret-change-in-production}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_FROM: ${SMTP_FROM:-noreply@sipsetu.com}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: celery-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    labels:
      - "logging=promtail"
    volumes:
      - ./backend:/app
      - backend_ml_artifacts:/app/ml_artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sipsetu-network
    profiles:
      - production
      - worker

  # Low-priority worker for ML retraining (Phase 4.3) — isolated from the
  # interactive worker so heavy training never competes with email delivery.
  celery-worker-retrain:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sipsetu-celery-worker-retrain
    command: celery -A celery_app worker --loglevel=info --concurrency=1 -Q retrain -n retrain@%h
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sipsetu
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-sipsetu-dev-jwt-secret-change-in-production}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: celery-worker-retrain
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    labels:
      - "logging=promtail"
    volumes:
      - ./backend:/app
      - backend_ml_artifacts:/app/ml_artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sipsetu-network
    profiles:
      - production
      - worker

  # Celery beat for periodic tasks
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sipsetu-celery-beat
    command: celery -A celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sipsetu
      REDIS_URL: redis://redis:6379/0
    labels:
      - "logging=promtail"
    volumes:
      - ./backend:/app
      - backend_ml_artifacts:/app/ml_artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sipsetu-network
    profiles:
      - production
      - worker

  # ------------------------------------------------------------------
  # Observability stack (Phase 3) — enable with:
  #   docker compose --profile observability up
  # Configs live in ./monitoring. Grafana: http://localhost:3000
  # Prometheus: http://localhost:9090  Alertmanager: http://localhost:9093
  # ------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: sipsetu-prometheus
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - sipsetu-network
    profiles:
      - observability

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: sipsetu-alertmanager
    command: --config.file=/etc/alertmanager/alertmanager.yml
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-https://example.invalid/sipsetu-slack-placeholder}
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager
    ports:
      - "9093:9093"
    depends_on:
      - prometheus
    networks:
      - sipsetu-network
    profiles:
      - observability

  grafana:
    image: grafana/grafana:11.1.0
    container_name: sipsetu-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - sipsetu-network
    profiles:
      - observability

  loki:
    image: grafana/loki:3.0.0
    container_name: sipsetu-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki:/etc/loki
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - sipsetu-network
    profiles:
      - observability

  promtail:
    image: grafana/promtail:3.0.0
    container_name: sipsetu-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail:/etc/promtail
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki
    networks:
      - sipsetu-network
    profiles:
      - observability

  otel-collector:
    image: otel/opentelemetry-collector:0.103.0
    container_name: sipsetu-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./monitoring/otel-collector:/etc/otel
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - sipsetu-network
    profiles:
      - observability

volumes:
  postgres_data:
  redis_data:
  backend_ml_artifacts:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  sipsetu-network:
    driver: bridge