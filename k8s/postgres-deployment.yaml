apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sipsetu-postgres
  labels:
    app.kubernetes.io/name: sipsetu-postgres
    app.kubernetes.io/component: database
spec:
  serviceName: sipsetu-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sipsetu-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sipsetu-postgres
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: "sipsetu"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sipsetu-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - sipsetu
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - sipsetu
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}
  restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: sipsetu-postgres
  labels:
    app.kubernetes.io/name: sipsetu-postgres
spec:
  selector:
    app.kubernetes.io/name: sipsetu-postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  type: ClusterIP
