apiVersion: apps/v1
kind: Deployment
metadata:
  name: sipsetu-frontend
  labels:
    app.kubernetes.io/name: sipsetu-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sipsetu-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sipsetu-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: gcr.io/PROJECT_ID/sipsetu-frontend:latest  # Replace PROJECT_ID
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: sipsetu-frontend
  labels:
    app.kubernetes.io/name: sipsetu-frontend
spec:
  selector:
    app.kubernetes.io/name: sipsetu-frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  type: LoadBalancer
