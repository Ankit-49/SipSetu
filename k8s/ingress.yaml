apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sipsetu-ingress
  labels:
    app.kubernetes.io/name: sipsetu
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - sipsetu.com
        - www.sipsetu.com
      secretName: sipsetu-tls
  rules:
    - host: sipsetu.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sipsetu-backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sipsetu-frontend
                port:
                  number: 80
    - host: www.sipsetu.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sipsetu-backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sipsetu-frontend
                port:
                  number: 80
