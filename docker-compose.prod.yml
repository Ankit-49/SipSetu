version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sipsetu-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sipsetu}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sipsetu}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sipsetu-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: always

  # Redis for caching, rate limiting, Celery
  redis:
    image: redis:7-alpine
    container_name: sipsetu-redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-sipsetu-redis-password}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-sipsetu-redis-password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sipsetu-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: always

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: sipsetu-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sipsetu}
      REDIS_URL: redis://:${REDIS_PASSWORD:-sipsetu-redis-password}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-https://sipsetu.com}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_FROM: ${SMTP_FROM:-noreply@sipsetu.com}
      FLASK_ENV: production
      ENVIRONMENT: production
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      SENTRY_DSN: ${SENTRY_DSN:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_WORKER_CONNECTIONS: ${GUNICORN_WORKER_CONNECTIONS:-1000}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}
      GUNICORN_KEEP_ALIVE: ${GUNICORN_KEEP_ALIVE:-5}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
      GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-50}
      ENABLE_MIGRATIONS: ${ENABLE_MIGRATIONS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    labels:
      - "logging=promtail"
    volumes:
      - backend_ml_artifacts:/app/ml_artifacts
      - backend_logs:/app/logs
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sipsetu-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: sipsetu-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - sipsetu-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Celery worker for background tasks
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: sipsetu-celery-worker
    command: >
      celery -A celery_app worker
      --loglevel=info
      --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
      -Q celery,email,bulk_screen
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sipsetu}
      REDIS_URL: redis://:${REDIS_PASSWORD:-sipsetu-redis-password}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_FROM: ${SMTP_FROM:-noreply@sipsetu.com}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: celery-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LOG_LEVEL: ${LOG_LEVEL:-info}
    labels:
      - "logging=promtail"
    volumes:
      - backend_ml_artifacts:/app/ml_artifacts
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sipsetu-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Low-priority worker for ML retraining
  celery-worker-retrain:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: sipsetu-celery-worker-retrain
    command: >
      celery -A celery_app worker
      --loglevel=info
      --concurrency=1
      -Q retrain
      -n retrain@%h
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sipsetu}
      REDIS_URL: redis://:${REDIS_PASSWORD:-sipsetu-redis-password}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: celery-worker-retrain
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LOG_LEVEL: ${LOG_LEVEL:-info}
    labels:
      - "logging=promtail"
    volumes:
      - backend_ml_artifacts:/app/ml_artifacts
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sipsetu-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Celery monitoring dashboard
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: sipsetu-flower
    command: >
      celery -A celery_app flower
      --port=5555
      --broker_api=redis://:${REDIS_PASSWORD:-sipsetu-redis-password}@redis:6379/0
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sipsetu}
      REDIS_URL: redis://:${REDIS_PASSWORD:-sipsetu-redis-password}@redis:6379/0
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-admin:${FLOWER_PASSWORD:-sipsetu}}
    labels:
      - "logging=promtail"
    volumes:
      - backend_logs:/app/logs
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sipsetu-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    restart: always

  # Celery beat for periodic tasks
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: sipsetu-celery-beat
    command: >
      celery -A celery_app beat
      --loglevel=info
      --scheduler celery.beat:PersistentScheduler
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sipsetu}
      REDIS_URL: redis://:${REDIS_PASSWORD:-sipsetu-redis-password}@redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-info}
    labels:
      - "logging=promtail"
    volumes:
      - backend_ml_artifacts:/app/ml_artifacts
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sipsetu-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    restart: always

  # ------------------------------------------------------------------
  # Observability stack
  # ------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: sipsetu-prometheus
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - sipsetu-network
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: sipsetu-alertmanager
    command: --config.file=/etc/alertmanager/alertmanager.yml
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager
    ports:
      - "9093:9093"
    depends_on:
      - prometheus
    networks:
      - sipsetu-network
    deploy:
      resources:
        limits:
          memory: 128M
    restart: always

  grafana:
    image: grafana/grafana:11.1.0
    container_name: sipsetu-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - sipsetu-network
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always

  loki:
    image: grafana/loki:3.0.0
    container_name: sipsetu-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki:/etc/loki
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - sipsetu-network
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always

  promtail:
    image: grafana/promtail:3.0.0
    container_name: sipsetu-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail:/etc/promtail
      - /var/run/docker.sock:/var/run/docker.sock
      - backend_logs:/var/log/sipsetu:ro
    depends_on:
      - loki
    networks:
      - sipsetu-network
    deploy:
      resources:
        limits:
          memory: 128M
    restart: always

  otel-collector:
    image: otel/opentelemetry-collector:0.103.0
    container_name: sipsetu-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./monitoring/otel-collector:/etc/otel
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - sipsetu-network
    deploy:
      resources:
        limits:
          memory: 256M
    restart: always

volumes:
  postgres_data:
  redis_data:
  backend_ml_artifacts:
  backend_logs:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  sipsetu-network:
    driver: bridge
