# Prometheus configuration for SipSetu (Phase 3 observability stack).
# Runs via docker-compose profile `observability`.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  # SipSetu backend — /metrics exposed by prometheus-flask-exporter
  - job_name: "sipsetu-backend"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "backend:5000"

  # Flower — Celery monitoring dashboard (Phase 4.3)
  - job_name: "sipsetu-flower"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "flower:5555"

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
