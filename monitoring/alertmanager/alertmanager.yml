# Alertmanager configuration for SipSetu (Phase 3.2).
#
# Notifications go to Slack. Set SLACK_WEBHOOK_URL in your environment
# (or .env file) before running `docker compose --profile observability up`
# so docker-compose substitutes it into slack_api_url below. The default
# placeholder keeps the container bootable without a webhook.
global:
  resolve_timeout: 5m
  slack_api_url: "${SLACK_WEBHOOK_URL}"

route:
  receiver: "slack-warning"
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: "slack-critical"
    - matchers:
        - severity = "warning"
      receiver: "slack-warning"

receivers:
  - name: "slack-critical"
    slack_configs:
      - channel: "#sipsetu-alerts"
        title: "[CRITICAL] {{ .GroupLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n---\n{{ end }}"
        send_resolved: true

  - name: "slack-warning"
    slack_configs:
      - channel: "#sipsetu-alerts"
        title: "[WARNING] {{ .GroupLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n---\n{{ end }}"
        send_resolved: true
