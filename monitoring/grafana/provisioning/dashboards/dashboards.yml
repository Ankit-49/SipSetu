# Grafana dashboard provider provisioning for SipSetu (Phase 3).
apiVersion: 1

providers:
  - name: SipSetu
    orgId: 1
    folder: SipSetu
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
